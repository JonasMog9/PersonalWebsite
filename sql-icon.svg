<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a2a52" rx="15" ry="15"/>

  <!-- Database cylinder -->
  <ellipse cx="200" cy="80" rx="100" ry="40" fill="#4361ee" stroke="#4cc9f0" stroke-width="3"/>
  <rect x="100" y="80" width="200" height="140" fill="#4361ee" stroke="#4cc9f0" stroke-width="0"/>
  <ellipse cx="200" cy="220" rx="100" ry="40" fill="#4361ee" stroke="#4cc9f0" stroke-width="3"/>

  <!-- SQL text -->
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="#ffffff" text-anchor="middle">SQL</text>

  <!-- Connection lines -->
  <path d="M120,120 L90,150 M280,120 L310,150 M200,250 L200,280" stroke="#4cc9f0" stroke-width="4" stroke-linecap="round"/>

  <!-- Data points/nodes -->
  <circle cx="90" cy="150" r="8" fill="#ffffff"/>
  <circle cx="310" cy="150" r="8" fill="#ffffff"/>
  <circle cx="200" cy="280" r="8" fill="#ffffff"/>

  <!-- Decorative data flow lines -->
  <path d="M140,100 L260,100 M140,130 L260,130 M140,160 L260,160 M140,190 L260,190" stroke-dasharray="5,5" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
</svg>
