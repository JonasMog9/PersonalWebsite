[build]
  publish = "."

# Long cache for images and the demo video; HTML/CSS/JS keep Netlify's defaults
# so updates show up right away after a deploy.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
